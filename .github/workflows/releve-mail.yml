# Réveil du relevé des mails toutes les heures (gratuit avec GitHub Actions).
# Chaque restaurant n'est relevé que si l'intervalle choisi dans Réglages est écoulé.
# À configurer une fois : Settings > Secrets and variables > Actions > New repository secret
#   CRON_SECRET = même valeur que dans Vercel.
name: Relevé des mails

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

jobs:
  releve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Appeler /api/cron/mail
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "Secret CRON_SECRET absent : ajoute-le dans les réglages du dépôt."; exit 1; fi
          code=$(curl -sS -o out.json -w "%{http_code}" --max-time 320 -H "Authorization: Bearer $CRON_SECRET" https://tibs.vercel.app/api/cron/mail)
          cat out.json; echo
          test "$code" = "200"
      - name: Appeler /api/cron/uber (robot Uber Eats, au plus toutes les 12 h par restaurant)
        if: always()
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          code=$(curl -sS -o uber.json -w "%{http_code}" --max-time 320 -H "Authorization: Bearer $CRON_SECRET" https://tibs.vercel.app/api/cron/uber)
          cat uber.json; echo
          test "$code" = "200"
      - name: Appeler /api/cron/laddition (journées et tickets Z de L'Addition, une fois par jour après 6 h)
        if: always()
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          code=$(curl -sS -o laddition.json -w "%{http_code}" --max-time 320 -H "Authorization: Bearer $CRON_SECRET" https://tibs.vercel.app/api/cron/laddition)
          cat laddition.json; echo
          test "$code" = "200"
