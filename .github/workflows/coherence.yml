# Rattrapage de mois passés dans L'Addition (lancé à la main) : journées de l'export (CB, espèces, Uber…)
# rangées dans l'app, sans lire les tickets Z. Le journal n'affiche que des compteurs.
name: Rattrapage L'Addition (manuel)

on:
  workflow_dispatch:
    inputs:
      mois:
        description: "Mois à relever, ex. 2026-08,2026-09"
        required: true
        default: ""

jobs:
  rattrapage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Relever les mois dans L'Addition
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          MOIS: ${{ inputs.mois }}
        run: |
          for m in $(echo "$MOIS" | tr ',' ' '); do
            if ! [[ "$m" =~ ^[0-9]{4}-[0-9]{2}$ ]]; then echo "mois ignoré : $m"; continue; fi
            echo "== $m"
            curl -sS --max-time 320 -H "Authorization: Bearer $CRON_SECRET" "https://tibs.vercel.app/api/cron/laddition?force=1&sansZ=1&mois=$m"
            echo
          done
