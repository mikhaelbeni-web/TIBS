# Lancé à la main. Deux actions sur des mois passés :
# - rattrapage : journées de l'export L'Addition (CB, espèces, Uber…) rangées dans l'app, sans lire les tickets Z ;
# - controle : chaque journée CB du Z rapprochée des remises CB de la banque, avec et sans date de valeur.
# Le journal est public : il n'affiche que des compteurs, jamais un montant ni un libellé.
name: Rattrapage et contrôle CB (manuel)

on:
  workflow_dispatch:
    inputs:
      mois:
        description: "Mois, ex. 2026-08,2026-09"
        required: true
        default: ""
      action:
        description: "controle (CB caisse ↔ banque), controle-detail (détail dans le journal Vercel, privé), releve-controle (relevé bancaire d'abord) ou rattrapage (L'Addition)"
        required: true
        default: controle
        type: choice
        options:
          - controle
          - controle-detail
          - releve-controle
          - rattrapage

jobs:
  rattrapage:
    if: inputs.action == 'rattrapage'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Relever les mois dans L'Addition
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          MOIS: ${{ inputs.mois }}
        run: |
          for m in $(echo "$MOIS" | tr ',' ' '); do
            if ! [[ "$m" =~ ^[0-9]{4}-[0-9]{2}$ ]]; then echo "mois ignoré : $m"; continue; fi
            echo "== $m"
            curl -sS --max-time 320 -H "Authorization: Bearer $CRON_SECRET" "https://tibs.vercel.app/api/cron/laddition?force=1&sansZ=1&mois=$m"
            echo
          done

  controle:
    if: inputs.action == 'controle' || inputs.action == 'controle-detail' || inputs.action == 'releve-controle'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Rapprocher CB caisse et remises CB (compteurs)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          MOIS: ${{ inputs.mois }}
          RELEVE: ${{ inputs.action == 'releve-controle' && '1' || '0' }}
          DETAIL: ${{ inputs.action == 'controle-detail' && '1' || '0' }}
        run: |
          if ! [[ "$MOIS" =~ ^[0-9]{4}-[0-9]{2}(,[0-9]{4}-[0-9]{2})*$ ]]; then echo "mois attendus : AAAA-MM[,AAAA-MM]"; exit 1; fi
          code=$(curl -sS -o out.json -w "%{http_code}" --max-time 320 -H "Authorization: Bearer $CRON_SECRET" "https://tibs.vercel.app/api/cron/controle-cb?mois=$MOIS&releve=$RELEVE&detail=$DETAIL")
          echo "HTTP $code"; cat out.json; echo
          test "$code" = "200"
